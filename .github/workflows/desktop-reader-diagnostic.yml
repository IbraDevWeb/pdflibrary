name: Diagnostic de lecture Folio Desktop
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'desktop/**'
      - 'vite.config.js'
      - 'package.json'
      - '.github/workflows/desktop-reader-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build:desktop
      - name: Générer un PDF typographique avec une police libre embarquée
        run: |
          python3 -m pip install --quiet reportlab
          python3 desktop/generate-font-fixture.py
      - name: Ouvrir un PDF et EPUB dans Electron avec affichage virtuel
        run: xvfb-run -a node desktop/diagnose.cjs
        env:
          ELECTRON_DISABLE_GPU: '1'
      - name: Publier les aperçus visuels Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folio-windows-design-previews
          path: desktop-previews/*.png
          if-no-files-found: ignore
          retention-days: 7
