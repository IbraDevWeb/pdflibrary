name: Examiner la disponibilité de la recherche Usul
on:
  push:
    paths:
      - tests/usul-live-probe.mjs
      - .github/workflows/usul-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/usul-live-probe.mjs
