name: Construire Folio pour Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Installer Folio Windows 64 bits
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Tester la bibliothèque et les accès aux fichiers
        run: npm test
      - name: Compiler la liseuse hors ligne
        run: npm run build:desktop
      - name: Vérifier les points d'entrée Windows et les ressources du lecteur
        shell: pwsh
        run: |
          node --check desktop/main.cjs
          node --check desktop/paths.cjs
          if (!(Test-Path 'dist/index.html')) { throw 'Interface Folio manquante' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Générer la nouvelle identité Folio Windows
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python desktop/generate-icon.py
          if (!(Test-Path 'desktop/icon.ico')) { throw 'Nouvelle icône manquante' }
          if (!(Test-Path 'dist/icons/folio-mark.svg')) { throw 'Logo SVG non empaqueté' }
          if (!(Test-Path 'dist/art/folio-library-hero.svg')) { throw 'Illustration de l’accueil absente' }
      - name: Fabriquer l'installateur Windows EXE
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Vérifier le fichier d'installation
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem 'release/Folio-Setup-*-x64.exe' -ErrorAction Stop)
          if ($installers.Count -ne 1) { throw 'Installateur Folio introuvable ou ambigu' }
          if ($installers[0].Length -lt 10000000) { throw 'Installateur Folio anormalement petit' }
          Write-Output "Installateur vérifié : $($installers[0].Name), $([math]::Round($installers[0].Length / 1MB, 1)) Mo"
      - uses: actions/upload-artifact@v4
        with:
          name: folio-windows-setup-x64
          path: release/Folio-Setup-*-x64.exe
          retention-days: 30
          if-no-files-found: error
