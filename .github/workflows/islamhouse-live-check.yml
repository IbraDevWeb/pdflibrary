name: Vérifier le catalogue IslamHouse en direct
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmer l'accès réel aux livres et pièces jointes IslamHouse
        run: node tests/islamhouse-live-check.mjs
